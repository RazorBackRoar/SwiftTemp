name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: macos-26
    steps:
      - name: Checkout SwiftTemp
        uses: actions/checkout@v7

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build release (arm64)
        run: swift build -c release --arch arm64

      - name: Verify arm64-only binary
        run: |
          ARCHS="$(lipo -archs .build/release/SwiftTemp)"
          if [ "$ARCHS" != "arm64" ]; then
            echo "Error: expected arm64 executable, found: $ARCHS" >&2
            exit 1
          fi
